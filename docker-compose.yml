services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
  app:
    build: .
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/lingohub
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your shell or a .env file}
      CLIENT_ORIGIN: "*"
      # TRUST_PROXY: "1"   # uncomment when running behind a reverse proxy / load balancer
    ports: ["4000:4000"]
volumes:
  mongo-data:
